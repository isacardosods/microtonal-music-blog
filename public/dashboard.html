<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entretons | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js" integrity="sha512-JPcRR8yFa8mmCsfrw4TNte1ZvF1e3+1SdGMslZvmrzDYxS69J7J49vkFL8u6u8PlPJK+H3voElBtUCzaXj+6ig==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <div class="left-painel">
        <div class="logo">
            <a href="index.html"><span>Entretons</span></a>
            <img src="./assets/img/logo-img.svg" alt="logo-img">
        </div> 

        <span>MENU</span>
        <ul>
            <li>
                <img src="assets/img/dashboard.svg" alt="">
                <a href="dashboard.html">Dashboard</a>
            </li>
            <li>
                <img src="assets/img/estatisticas.svg" alt="">
                <a href="ranking.html">Ranking</a>
            </li>
        </ul>

        <span>GERAL</span>
        <ul>
            <li>
                <img src="assets/img/logout.svg" alt="">
                <a href="index.html" onclick="limparSessao()">Logout</a>
            </li>
        </ul>
    </div>
    
    <main>

        <div class="top-painel">
            <div class="text-box">
                <p id="bem_vindo"></p>
                <span>Acompanhe seus status</span>
            </div>
        </div>

        <div class="indicadores">
            <div class="indicador">
                <span class="title">Total de tentativas</span>
                <span class="value" id="tentativas_value"></span>
                <span class="legenda">Não desista! :)</span>
            </div>

            <div class="indicador">
                <span class="title">Respostas corretas</span>
                <span class="value" id="corretas_value"></span>
                <span class="legenda">Todas as tentativas</span>
            </div>

            <div class="indicador">
                <span class="title">Gêneros explorados</span>
                <span class="value" id="generos_porcentagem"></span>
                 <span class="legenda">De 14 gêneros</span>
            </div>

            <div class="indicador">
                <span class="title">Músicas exploradas</span>
                <span class="value" id="musicas_porcentagem">5</span>
                 <span class="legenda">De 6 músicas</span>
            </div>
        </div>

        <div class="graficos">
            <div class="grafico">
                <p>Evolução das tentativas</p>
                <div class="grafico-container">
                    <canvas id="grafico_line"></canvas>
                </div>
            </div>
            <div class="grafico segundo">
                <p>Percentual de acerto</p>
                <div class="grafico-container">
                    <canvas id="grafico_donut"></canvas>
                </div>
            </div>
        </div>
        
    </main>
</body>
<script src="js/dashboard.js"></script>
<script src="js/sessao.js"></script>

</html>
