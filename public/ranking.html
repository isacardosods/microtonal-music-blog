<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entretons | Ranking</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/ranking.css">
</head>

<body>
    <div class="left-painel">
        <div class="logo">
            <a href="index.html"><span>Entretons</span></a>

        </div>

        <span>MENU</span>
        <ul>
            <li>

            <li>
                <img src="assets/img/estatisticas.svg" alt="">

            </li>
        </ul>

            <li>

        <div class="top-painel">
            <div class="text-box">
